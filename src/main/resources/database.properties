# EthioTour Database Configuration
# Switch between IN_MEMORY and MSSQL modes

# Mode: IN_MEMORY, SQLITE, or MSSQL
db.mode=SQLITE

# SQLite Configuration
db.sqlite.path=ethiotour.db

# MS SQL Server Configuration
db.mssql.server=localhost
db.mssql.port=1433
db.mssql.database=EthioTourDB
db.mssql.username=sa
db.mssql.password=YOUR_SA_PASSWORD_HERE
db.mssql.encrypt=false
db.mssql.trustServerCertificate=true
db.mssql.loginTimeout=30

# Connection Pool Configuration
db.pool.initialSize=5
db.pool.maxSize=20
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# API Configuration (for future backend integration)
api.base.url=http://localhost:8080/api
api.key=YOUR_API_KEY_HERE
